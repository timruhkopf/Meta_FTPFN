# @package _global_

# Root configuration for PPFN training (src/train.py). Override per run via
# configs/experiment/ (selects deployment + callbacks + output dirs).
#
# `model` and `benchmark` have no active implementation yet (see
# configs/model/README.md, configs/benchmark/README.md) — they're declared as
# mandatory (`???`) so running without them fails loudly and early instead of
# with a confusing AttributeError deep in train.py.

defaults:
  - model: ???
  - prior: bnn
  - benchmark: ???
  - optimizer: adamw
  - scheduler: cosine_with_warmup
  - trainer: default
  - callbacks:
      - mlflow
      - clip
  # `experiment` last (before `_self_`): an experiment config's own body can
  # override a sub-key of any group selected above (e.g. callbacks.mlflow.*)
  # only if it merges in AFTER that group's file does. With `experiment`
  # earlier in this list, such per-key overrides were silently clobbered by
  # the group file's own default merging in later -- see step4_pathway.yaml
  # and the mlflow_old.yaml/debug.yaml `mlflow_tracking_uri` history for the
  # gap this caused.
  - experiment: debug
  - _self_

device: "cuda"

# will be set by SLURM job id when dispatched via configs/deployment/slurm.yaml,
# otherwise a timestamp
run_name: ${oc.env:SLURM_JOB_ID, ${now:%Y-%m-%d}_${now:%H-%M-%S}}

trainer:
  trainer_class:
    callbacks: ${callbacks}

seed: 42
hash: ${githash:''}

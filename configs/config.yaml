# @package _global_

# Root configuration for PPFN training (src/train.py). Override per run via
# configs/experiment/ (selects deployment + callbacks + output dirs).
#
# `model` and `benchmark` have no active implementation yet (see
# configs/model/README.md, configs/benchmark/README.md) — they're declared as
# mandatory (`???`) so running without them fails loudly and early instead of
# with a confusing AttributeError deep in train.py.

defaults:
  - model: ???
  - prior: bnn
  - benchmark: ???
  - optimizer: adamw
  - scheduler: cosine_with_warmup
  - trainer: default
  - experiment: debug
  - callbacks:
      - mlflow
      - clip
  - _self_

device: "cuda"

# will be set by SLURM job id when dispatched via configs/deployment/slurm.yaml,
# otherwise a timestamp
run_name: ${oc.env:SLURM_JOB_ID, ${now:%Y-%m-%d}_${now:%H-%M-%S}}

trainer:
  trainer_class:
    callbacks: ${callbacks}

seed: 42
hash: ${githash:''}

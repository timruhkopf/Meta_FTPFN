# @package _global_
#
# Smoke-test config for the Iterative Registration Transformer -- tiny model,
# short run, to confirm the real Hydra/dataloader/trainer path wires up
# correctly before configs/experiment/iterative_registration.yaml.
#
# Run (needs `~benchmark` on the CLI, same as every pipeline.train experiment):
#   python -m ppfn.pipelines.train experiment=iterative_registration_debug experiment_name=00-debug-iterative-registration ~benchmark

defaults:
  - /loss: iterative_registration
  - /deployment: local
  - /callbacks:
      - mlflow
      - clip
  - override /prior: lupi
  - override /model: iterative_registration_pfn
  - override /optimizer: adamw_registration
  - override /trainer: id_token
  - _self_

experiment_name: ???
run_name: Null

callbacks:
  mlflow:
    tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, file://${root:}/mlruns}
    experiment_name: iterative-registration-debug

prior:
  batch_size: 8
  s_max: 0.1
  n_a_range: [8, 32]
  n_b_range: [8, 32]
  warp_grid_n: 4

model:
  d_model: 32
  n_heads: 4
  n_ff: 64
  n_iters: 3
  n_hslots: 4
  rqs_bins: 6

trainer:
  epochs: 2
  steps: 5
  trainer_class:
    val_size: 8

hydra:
  run:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/${run_name}
  sweep:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/sweeps/${run_name}

# @package _global_
#
# Lower/upper bound PFN for the ppfn.prior.lupi prior --
# ppfn.model.baselines.lupi_bounds_pfn.BoundsPFN. One model, trained on
# both severed (A_ctx alone, the LOWER bound) and pooled ([A_ctx ; B_inA],
# the UPPER bound) every batch -- see that module's docstring.
#
# Run:
#   python -m ppfn.pipelines.train experiment=lupi_bounds experiment_name=01-pretraining-lupi-bounds ~benchmark

defaults:
  - /loss: lupi_bounds
  - /deployment: local
  - /callbacks:
      - mlflow
      - clip
      - checkpoint
  - override /prior: lupi
  - override /model: lupi_bounds_pfn
  - override /optimizer: adamw_registration
  - override /trainer: lupi_bounds
  - _self_

experiment_name: ???
run_name: Null

mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, file://${root:}/mlruns}

callbacks:
  mlflow:
    tracking_uri: ${mlflow_tracking_uri}
    experiment_name: lupi-decoder-comparison
    run_name: no-id-shared-bounds
  checkpoint:
    monitor: val/loss/upper_nll

prior:
  batch_size: 64  # scaled up 2026-09-16 to use the GPU efficiently -- 24 alone used ~2.7GB/24GB; running alongside lupi_id_token_baseline, not sequentially
  num_workers: 6  # halved from 8: two experiments now run in parallel on one 16-core box
  n_a_range: [8, 100]
  n_b_range: [8, 100]
  n_qry_range: [8, 64]
  warp_grid_n: 4

trainer:
  epochs: 100
  steps: 500
  trainer_class:
    val_size: 64
    use_bf16: true

scheduler:
  warmup_epochs: 5000
  eta_min: 3e-5

hydra:
  run:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/${run_name}
  sweep:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/sweeps/${run_name}

# @package _global_
#
# LUPI-style additive-ID-token baseline: shared IDTokenPFN backbone, student
# [A,B] (raw, unregistered) + teacher [A,B_inA] (privileged, true-transport)
# batch-stacked in one forward pass, student pulled toward the teacher via
# plain cross-entropy (not forward KL -- see ppfn.loss.lupi_id_token_loss's
# module docstring). Answers whether registering two tasks purely
# in-context (ppfn.model.baselines.id_token_pfn.IDTokenPFN alone) is the
# hard part, by seeing how much gap closes when the true registration is
# available as a training-time-only signal.
#
# Run:
#   python -m ppfn.pipelines.train experiment=lupi_id_token_baseline experiment_name=01-pretraining-lupi-id-token ~benchmark

defaults:
  - /loss: lupi_id_token
  - /deployment: local
  - /callbacks:
      - mlflow
      - clip
      - checkpoint
  - override /prior: lupi
  - override /model: lupi_id_token_pfn
  - override /optimizer: adamw_registration
  - override /trainer: id_token
  - _self_

experiment_name: ???
run_name: Null

mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, file://${root:}/mlruns}

callbacks:
  mlflow:
    tracking_uri: ${mlflow_tracking_uri}
    experiment_name: lupi-decoder-comparison
    run_name: lupi-student-teacher
  checkpoint:
    monitor: val/loss/nll_student

prior:
  batch_size: 32  # scaled up 2026-09-16 (was 12) to use the GPU efficiently -- doubles internally (student+teacher stacking) to an effective 64
  num_workers: 6  # halved from 8: two experiments now run in parallel on one 16-core box
  n_a_range: [8, 100]
  n_b_range: [8, 100]
  warp_grid_n: 4  # reuse the LUPI-found speedup -- see id_token_baseline.yaml's identical override

trainer:
  epochs: 100
  steps: 500
  trainer_class:
    val_size: 48
    use_bf16: true

scheduler:
  warmup_epochs: 5000
  eta_min: 3e-5

hydra:
  run:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/${run_name}
  sweep:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/sweeps/${run_name}

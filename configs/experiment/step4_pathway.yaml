# @package _global_
#
# ARCHITECTURE.md build order step 3 / CLAUDE.md build-order step 4, the
# go/no-go run: encoder + gated cross-attention trained at rho=0 only
# (prior=p0_identity), transport residual disabled (t_i = x-tilde_i^A,
# exactly correct there -- trainer.force_identity_transport), pathway
# distillation on (it's always on in loss=full; at rho=0 it's the only
# non-floor loss term that matters). Registration contributes nothing at
# rho=0, so failure here is unambiguously an architecture/plumbing problem,
# not a hard inference one -- target: match upper-2 (the pooled oracle).
#
# Run:
#   python -m ppfn.pipelines.train experiment=step4_pathway experiment_name=00-debug-step4 ~benchmark

defaults:
  - /loss: full
  - /deployment: local
  - /callbacks:
      - mlflow
      - clip
      - checkpoint
  - override /prior: p0_identity
  - override /model: encoder_decoder
  - override /optimizer: adamw_registration
  - override /trainer: registration
  - _self_

experiment_name: ???
run_name: Null

# Same file-store MLflow backend the running pfn-variable-dim5-reference
# baseline uses (configs/callbacks/mlflow.yaml's own default, `.env`'s
# MLFLOW_TRACKING_URI) -- kept as an explicit interpolation target here
# (rather than only relying on the shared default) so this run and the
# baseline it's meant to be compared against are guaranteed to land in the
# same store even if one of the two defaults ever drifts.
mlflow_tracking_uri: ${oc.env:MLFLOW_TRACKING_URI, file://${root:}/mlruns}

callbacks:
  mlflow:
    tracking_uri: ${mlflow_tracking_uri}
    experiment_name: registration-step4-pathway

trainer:
  trainer_class:
    force_identity_transport: true

scheduler:
  warmup_epochs: 5000
  eta_min: 3e-5

hydra:
  run:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/${run_name}
  sweep:
    dir: ${oc.env:ROOT}/outputs/${experiment_name}/sweeps/${run_name}

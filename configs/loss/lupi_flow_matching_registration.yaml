# Four-term loss for FlowMatchingRegistrationPFN: velocity regression
# (v_phi) + student-mixture NLL + teacher (upper-1) NLL + CE distillation.
# See ppfn.loss.lupi_flow_matching_registration_loss's module docstring.
# lambda_flow/lambda_ce fixed at 1.0 -- first cut, no curriculum, matching
# this repo's own "isolate whether this helps before tuning a schedule"
# precedent (docs/labbook/2026-09-16-lupi-registration-mechanism-and-architecture-survey.md).
loss_class:
  _target_: ppfn.loss.lupi_flow_matching_registration_loss.FlowMatchingRegistrationLoss
  lambda_flow: 1.0
  lambda_ce: 1.0

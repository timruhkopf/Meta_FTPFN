# Lower/upper bound PFN for ppfn.prior.lupi -- see
# ppfn.model.baselines.lupi_bounds_pfn's module docstring. n_layers=6 to
# match configs/model/lupi_pfn.yaml's align-stack depth (comparable
# capacity, not tuned independently).
d_model: 256
n_heads: 8
n_layers: 6
d_ff: 512
n_bins_predictive: 64
dropout: 0.0
d_max: 5  # must match ppfn.prior.lupi.dataset.D_MAX

model_class:
  _target_: ppfn.model.baselines.lupi_bounds_pfn.BoundsPFN
  d_model: ${model.d_model}
  n_heads: ${model.n_heads}
  n_layers: ${model.n_layers}
  d_ff: ${model.d_ff}
  n_bins_predictive: ${model.n_bins_predictive}
  dropout: ${model.dropout}
  d_max: ${model.d_max}
  # MUST match prior.bounded01 -- picks plain uniform [0,1] calibration
  # bins instead of the (now-superseded) quantile-fit ones. See
  # ppfn.model.baselines.calibration.sample_calibration_borders and
  # .claude/rules/hydra.md's "meta info baked into config" convention for
  # why this reads from the prior group rather than duplicating the value.
  bounded01: ${prior.bounded01}

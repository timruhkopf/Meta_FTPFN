# LUPI-style additive-ID-token PFN: shared IDTokenPFN backbone, student
# [A,B] + teacher [A,B_inA] batch-stacked in one forward pass. See
# ppfn.model.baselines.lupi_id_token_pfn's module docstring.
d_model: 256
n_heads: 8
n_layers: 6
d_ff: 512
n_bins_predictive: 64
dropout: 0.0
d_max: 5

model_class:
  _target_: ppfn.model.baselines.lupi_id_token_pfn.LUPIIDTokenPFN
  d_model: ${model.d_model}
  n_heads: ${model.n_heads}
  n_layers: ${model.n_layers}
  d_ff: ${model.d_ff}
  n_bins_predictive: ${model.n_bins_predictive}
  dropout: ${model.dropout}
  d_max: ${model.d_max}

# LUPI-distilled alignment-aware multi-task PFN -- docs/labbook/'s
# 2026-09-14 build spec. Sized as a modest first real run, not tuned --
# see ppfn.model.lupi.model's module docstring.
d_model: 256
n_heads: 8
n_layers_enc_b: 3
n_layers_align: 6
d_ff: 512
n_bins_predictive: 64
dropout: 0.0
d_max: 5  # must match ppfn.prior.lupi.dataset.D_MAX

model_class:
  _target_: ppfn.model.lupi.model.LUPIPFN
  d_model: ${model.d_model}
  n_heads: ${model.n_heads}
  n_layers_enc_b: ${model.n_layers_enc_b}
  n_layers_align: ${model.n_layers_align}
  d_ff: ${model.d_ff}
  n_bins_predictive: ${model.n_bins_predictive}
  dropout: ${model.dropout}
  d_max: ${model.d_max}

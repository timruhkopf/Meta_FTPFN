# The LUPI-distilled alignment-aware multi-task PFN prior --
# docs/labbook/'s 2026-09-14 build spec, ppfn.prior.lupi. ADDITIVE to
# configs/prior/registration.yaml (a different generative recipe: adds the
# y-distortion h and a simulated-acquisition A-design; see
# ppfn.prior.lupi's package docstring), left untouched.
seed: 0
s_max: 0.1  # same calibration as configs/prior/registration.yaml -- reuses ppfn.prior.registration.warp verbatim
force_rho_zero: false
batch_size: 32
num_workers: 0  # same rho-curriculum multi-worker caveat as ppfn.prior.registration.dataset
d: null
n_a_range: [8, 256]
n_b_range: [256, 1024]
n_qry_range: [8, 128]
frac_uniform: 0.4   # spec §6.2's query mixture
frac_near_b: 0.4    # set to 0.0 to disable the anti-B-blindness mechanism (ablation)
query_eps_std: 0.03
# LUPI-local override of ppfn.prior.registration.warp's grid_n=5 default for
# the log|det J| rejection-band check + declared_box -- see
# docs/labbook/2026-09-14-lupi-prior-warp-grid-speedup.md: this dominates
# per-item CPU cost (~84%, scales as grid_n^d) and grid_n=4 cuts it ~3x for
# a modest loosening of the accept/reject band estimate. Never affects
# configs/prior/registration.yaml, which keeps grid_n=5.
warp_grid_n: 4
# Force a fixed acquisition aggressiveness instead of sample_beta's own
# per-draw sampling -- e.g. 0.0 for a clean, deterministic "no acquisition
# bias" ablation. null (default) preserves the original sampled-beta
# behavior (including its own 20% chance of landing on beta=0).
beta_override: null
# h -> identity (a=1,b=0,c=0) instead of sample_monotone_map -- the h-analog
# of force_rho_zero above, added 2026-09-17 for the same reason: isolating
# one of the two unknowns (T via force_rho_zero, h via this) to verify a
# single registration component against ground truth without the other
# unknown confounding the result. false (default) preserves the original
# sampled-h behavior.
force_h_identity: false
# Bounds h's CALIBRATED amplitude to this multiple range of f's own realized
# scale on each draw (ppfn.prior.lupi.monotone.calibrate_amplitude), added
# 2026-09-17 after notebooks/id_token_lupi_1d_comparison.ipynb's binning
# investigation found sample_monotone_map's raw, uncontrolled (a,b,c)
# compounding made FullSupportBarDistribution's one shared, globally-fit bin
# geometry badly mismatched for most individual draws (~4 of 64 bins
# covering a typical draw's own value range) -- see
# docs/labbook/2026-09-17-lupi-h-amplitude-calibration.md. h's SHAPE
# diversity is untouched; only the realized scale/location are bounded.
# IGNORED when bounded01=True below (calibrate_amplitude/MonotoneMap are
# superseded there by KumaraswamyMap -- see bounded01's own comment).
h_gain_range: [0.5, 2.0]
# Superseding construction (2026-09-17, default ON): every reported value
# lands in [0,1] BY CONSTRUCTION (self-normalized f + a global, cached,
# prior-design-time-fixed reference + a KumaraswamyMap h), not just a
# bounded-diversity real-valued range -- closes the granularity/step-artifact
# problem h_gain_range only partially closed (verified: median calibration-
# bin coverage of a draw's own local range 4/64 -> ~23/32, i.e. roughly full
# resolution, every draw). See docs/labbook/2026-09-17-lupi-bounded01-prior.md
# and ppfn.prior.lupi.sampler.sample_pair's own bounded01 docstring. Set
# false to fall back to the h_gain_range scheme above (e.g. for comparing
# against an already-trained pre-bounded01 checkpoint).
bounded01: true
# h's distortion severity, [0,1], DELIBERATELY INDEPENDENT of rho (T's own
# severity) -- both meant to be swept across their full range for controlled
# experiments, matching classical HPO's ability to observe the complete
# relatedness spectrum. null (default): sample per-draw from
# h_severity_range. Set to a fixed float (e.g. 0.0) for a deterministic
# severity ablation, mirroring beta_override's pattern. IGNORED when
# bounded01=False.
h_severity: null
h_severity_range: [0.0, 1.0]

dataset_class:
  _target_: ppfn.prior.lupi.dataset.LUPIStreamDataset
  seed: ${prior.seed}
  s_max: ${prior.s_max}
  force_rho_zero: ${prior.force_rho_zero}
  d: ${prior.d}
  n_a_range: ${prior.n_a_range}
  n_b_range: ${prior.n_b_range}
  n_qry_range: ${prior.n_qry_range}
  frac_uniform: ${prior.frac_uniform}
  frac_near_b: ${prior.frac_near_b}
  query_eps_std: ${prior.query_eps_std}
  warp_grid_n: ${prior.warp_grid_n}
  beta_override: ${prior.beta_override}
  force_h_identity: ${prior.force_h_identity}
  h_gain_range: ${prior.h_gain_range}
  bounded01: ${prior.bounded01}
  h_severity: ${prior.h_severity}
  h_severity_range: ${prior.h_severity_range}

dataloader_class:
  _target_: torch.utils.data.DataLoader
  batch_size: ${prior.batch_size}
  num_workers: ${prior.num_workers}
  collate_fn:
    _target_: ppfn.prior.lupi.dataset.collate_lupi_batch
    _partial_: true

# ppfn.trainer.bridge_trainer.BridgeTrainer -- no curriculum, so
# steps/epochs is just "how many logging cycles", same as
# configs/trainer/registration.yaml's identical convention.
epochs: 100
steps: 500

trainer_class:
  _target_: ppfn.trainer.bridge_trainer.BridgeTrainer
  grad_clip: 1.0
  val_size: 256
  val_seed: 999999
  val_d: ${prior.d}
  val_n_a_range: ${prior.n_a_range}
  val_n_b_range: ${prior.n_b_range}
  callbacks: null  # overridden to ${callbacks} in configs/config.yaml
  verbose: true

# ppfn.trainer.lupi_bounds_trainer.BoundsTrainer -- see that module's
# docstring; near-verbatim sibling of configs/trainer/lupi.yaml.
epochs: 100
steps: 500

trainer_class:
  _target_: ppfn.trainer.lupi_bounds_trainer.BoundsTrainer
  criterion: ${loss.loss_class}
  grad_clip: 1.0
  use_bf16: false
  val_size: 256
  val_seed: 999999
  val_s_max: ${prior.s_max}
  val_force_rho_zero: ${prior.force_rho_zero}
  val_n_a_range: ${prior.n_a_range}
  val_n_b_range: ${prior.n_b_range}
  val_n_qry_range: ${prior.n_qry_range}
  callbacks: null  # overridden to ${callbacks} in configs/config.yaml
  checkpoint_dir: null
  verbose: true

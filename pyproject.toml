[project]
name = "meta-ftpfn"
version = "0.7.0"
description = "PPFN: Batch awareness in PFNs for Meta-Task Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"python-dotenv>=1.2.2",
	"gpytorch>=1.14.3",
	"grakel>=0.1.10",
	"hydra-core>=1.3.2",
	"ifbo>=0.3.13",
	"matplotlib>=3.10.8",
	"nltk>=3.9.2",
	"numpy==1.26.4",
	"pandas>=2.3.3",
	"path>=17.1.1",
	"portalocker>=3.2.0",
	"psutil>=7.1.3",
	"pyyaml>=6.0.3",
	"scipy>=1.15.3",
	"submitit>=1.5.3",
	"tensorboard>=2.20.0",
	"torch>=2.5.0", # formerly torch==2.9.1
	# IFBO icml 2024 dependencies
	"PFNs4HPO",
	#	"mf-prior-bench",
	"neps_lcpfn_hpo",
	"pfns_hpo",
	"ConfigSpace==0.4.21",
	"seaborn>=0.13.2",
	"plotly>=6.5.2",
	"gitinfo>=1.2.0",
	"anytree>=2.13.0",
	"rich>=14.2.0",
	"pudb>=2025.1.5",
	"more-itertools>=10.8.0",
	"notebook>=7.5.3",
	"pip>=26.0.1",
	"mlflow==2.19.0",
	"hydra-submitit-launcher>=1.2.0",
	"mpmath>=1.3.0",
	"tabpfn>=8.1.0",
	"tqdm>=4.69.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "python-semantic-release>=10.5.3",
    "ruff>=0.15.1",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

# ifbo itself comes from PyPI (see dependencies above); mf-prior-bench isn't
# used by the active skeleton. Only the local editable packages actually
# imported today are sourced from external/ifbo_icml2024.
PFNs4HPO = { path = "./external/ifbo_icml2024/src/PFNs4HPO/", editable = true }
neps_lcpfn_hpo = { path = "./external/ifbo_icml2024/src/neps_lcpfn_hpo/", editable = true }
pfns_hpo = { path = "./external/ifbo_icml2024/src/pfns_hpo/", editable = true }


# Add a minimal PEP 517 build-system configuration so tools like pip can
# build/install this project. Also configure setuptools to find packages
# inside the `src/` layout.
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
